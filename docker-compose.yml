services:
  crate:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Set this before exposing the app beyond your own machine.
      CRATE_TOKEN: ${CRATE_TOKEN:-}
      CRATE_ALLOW_PRIVATE_URLS: ${CRATE_ALLOW_PRIVATE_URLS:-0}
    volumes:
      - crate-library:/library
      - crate-data:/data
    restart: unless-stopped

volumes:
  crate-library:
  crate-data:
