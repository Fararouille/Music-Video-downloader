[project]
name = "crate"
version = "0.1.0"
description = "Download music and video, then browse, stream, and organize it from any device on your network."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Youssef Elgharib" }]
keywords = ["yt-dlp", "media", "downloader", "music", "video", "self-hosted", "fastapi"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "yt-dlp>=2025.1.15",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
crate = "crate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
